# ci.yml — Argus 통합 CI
# macOS 러너는 분당 10x 차감 — 무료 분량 주의
#
# push/PR 마다 smoke.sh 를 실행해 빌드 + 단위 테스트 + i18n parity +
# CLI 동작(debug agents / status)을 자동 검증한다.

name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 ref 의 이전 실행은 취소해 러너 시간 절약.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Smoke test
        # 러너 키체인에는 Developer ID 인증서가 없으므로 ad-hoc 서명으로 빌드.
        # (build.sh 기본값이 Developer ID — ADR-0028. 서명/노터라이즈 검증은
        # release.sh 수동 단계의 몫이고, CI는 컴파일·테스트·CLI 동작만 본다.)
        run: ARGUS_SIGN_ID=- ./scripts/smoke.sh

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

  agentlink:
    name: Agentlink tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agentlink
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install agentlink dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck agentlink
        run: bun run typecheck

      - name: Test agentlink
        run: bun test

      - name: Build agentlink app
        run: bun run build:app
