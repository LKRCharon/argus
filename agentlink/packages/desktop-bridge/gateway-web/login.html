<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 Argus</title><link rel="stylesheet" href="/login.css"></head>
<body><main><div class="brand">Argus</div><h1>继续设备上的工作</h1><p>使用 OJ 的账号和密码登录。</p><form id="login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="64"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">登录</button><p id="notice" role="status"></p></form></main><script type="module" src="/login.js"></script></body>
</html>
